paths:
  workload: "workloads/300.json"
  platform: "platforms/platform-nasa-128-1800son-2700sof-w190son-w9sof.json"
  output: "results/RL/Timeout-300"

run:
  algorithm: "easy_psas"
  overrun_policy: "terminate"
  timeout: 300 # Num (Int) or Null
  # can be integer epoch, "now", or "YYYY-MM-DD HH:MM:SS"
  start_time: 0

rl:
  enabled: false
  learn: false
  type: "continuous" # "discrete" | "continuous"
  dt: 300 # required when type == "discrete"
  device: "cuda" # "cpu" | "cuda" | "auto" (explicit "auto" resolves to cuda if available)
  epochs: 1
  num_nodes: 128
  checkpoint: "results/RL/Train-250/agent_checkpoint.pt" # null if none, else path to checkpoint file

  agents:
    spars:
      class: "RL_Agent.SPARS.agent:ActorCritic"
      params:
        obs_dim: 6
        device: "cuda"
      optimizer:
        class: "torch.optim:Adam"
        params:
          lr: 0.0003

    import: import

  # Single-agent assignment — set to "thomas" or "spars"
  assign: "spars"

logging:
  level: "INFO"
  file: "results/simulation.log"
